# One bundle row activates the host and advertises the same package's dsh.client
# contribution to the browser module loader.
- insert:
    - id: PINNACLE-mcp-hub
      name: '@PINNACLE/mcp-hub'
      config:
        packs: ['@PINNACLE/pack-aec']
        discovery: { applyMode: confirm }
        defaults: { profile: coordination, writeMode: deny, maxVisibleTools: 120 }

